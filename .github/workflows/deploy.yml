name: Deploy

# Every change that reaches `main` goes live by itself. Production is the `backend-implementation`
# branch, so once CI on `main` is green this workflow (1) pushes any migration `main` adds to the
# hosted Supabase project, so the tables exist before the code that needs them, (2) merges `main`
# into `backend-implementation` and pushes it, and (3) deploys that branch to Vercel's production
# with the Vercel CLI. The Vercel project has no Git connection (since 2026-11-22, when the
# repository moved to an account the project's owner doesn't control), so nothing builds unless this
# workflow does it. The merge commit is authored as the Vercel project's owner: the Hobby plan
# refuses deployments whose commit is by anyone else.
#
# Run it by hand (Actions → Deploy → Run workflow) to redeploy production as it is, e.g. after
# changing an environment variable on Vercel.
#
# Needs, once, in the repository's Settings → Secrets and variables → Actions:
#   VERCEL_TOKEN            a token from vercel.com/account/tokens (the project owner's)
#   VERCEL_ORG_ID           the owner id of the Vercel project (team_… or the user's id)
#   VERCEL_PROJECT_ID       the Vercel project (prj_…; Project → Settings → General)
# Without these three nothing is deployed: the run fails before it touches the database.
#   SUPABASE_ACCESS_TOKEN   a personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    the project's database password (Supabase → Connect → reset if lost)
# With them every deploy runs `supabase db push` first (it applies only what the hosted project is
# missing, so this also catches up on any migration pushed late). Without them a change that adds a
# migration is NOT deployed (the run fails and says so), so the site never runs ahead of its
# database; changes without migrations still deploy.
#   TRIGGER_ACCESS_TOKEN    a Trigger.dev personal access token (account → Personal Access Tokens)
#   TRIGGER_PROJECT_REF     the Trigger.dev project (proj_…)
# With these two the job code in src/trigger/ is deployed to Trigger.dev's prod environment on
# every deploy (docs/SETUP-HOSTED.md §2); without them that step is skipped and production keeps
# running jobs inline (ORCA_JOBS on Vercel decides which the site uses).
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# One deploy at a time, in order; a second merge waits for the first.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Migrations, then main → backend-implementation
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: fbbimuspcsytjhbqlzzc
      HAVE_SUPABASE_SECRETS: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_DB_PASSWORD != '' }}
      HAVE_TRIGGER_SECRETS: ${{ secrets.TRIGGER_ACCESS_TOKEN != '' && secrets.TRIGGER_PROJECT_REF != '' }}
      HAVE_VERCEL_SECRETS: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: What main adds to production
        id: diff
        run: |
          git fetch origin backend-implementation
          if git merge-base --is-ancestor origin/main origin/backend-implementation; then
            echo "Production already has everything on main; nothing to deploy."
            echo "nothing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          migrations=$(git diff --name-only --diff-filter=A origin/backend-implementation...origin/main -- supabase/migrations | tr '\n' ' ')
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "New migrations: ${migrations:-none}"

      # Checked first, so the database and the jobs never move ahead of a site that can't follow.
      - name: Deploying needs the Vercel secrets
        if: env.HAVE_VERCEL_SECRETS != 'true' && (steps.diff.outputs.nothing != 'true' || github.event_name == 'workflow_dispatch')
        run: |
          echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID aren't all set as repository secrets, so this workflow can't deploy to Vercel (see the comment at the top of .github/workflows/deploy.yml). Nothing was changed. Add them and rerun this workflow."
          exit 1

      - name: Migrations need the Supabase secrets
        if: steps.diff.outputs.nothing != 'true' && steps.diff.outputs.migrations != '' && env.HAVE_SUPABASE_SECRETS != 'true'
        run: |
          echo "::error::main adds migrations (${{ steps.diff.outputs.migrations }}) but SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD aren't set as repository secrets, so they can't be pushed from here. Either add the secrets (see the comment at the top of .github/workflows/deploy.yml) and rerun this workflow, or run 'npx supabase db push' on main yourself and then rerun it."
          exit 1

      - uses: supabase/setup-cli@v1
        if: steps.diff.outputs.nothing != 'true' && env.HAVE_SUPABASE_SECRETS == 'true'
        with:
          # Pinned (the version in package.json): resolving "latest" asks GitHub's API without a token
          # and a deploy failed on its rate limit (2026-11-05). Bump it with the package.
          version: 2.119.0

      - name: Push pending migrations to the hosted project
        if: steps.diff.outputs.nothing != 'true' && env.HAVE_SUPABASE_SECRETS == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          # --yes: the CLI (since late 2026) asks to confirm before applying and can't on a runner.
          supabase db push --linked --yes

      - uses: actions/setup-node@v4
        if: steps.diff.outputs.nothing != 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 24
          cache: npm

      - name: Deploy the job code to Trigger.dev (prod)
        if: steps.diff.outputs.nothing != 'true' && env.HAVE_TRIGGER_SECRETS == 'true'
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_PROJECT_REF: ${{ secrets.TRIGGER_PROJECT_REF }}
        run: |
          npm ci --no-audit --no-fund
          npx --yes trigger.dev@4.8.3 deploy --env prod

      - name: Merge main into backend-implementation and push
        if: steps.diff.outputs.nothing != 'true'
        run: |
          git config user.name "${{ vars.DEPLOY_AUTHOR_NAME || 'Sophia Huh' }}"
          git config user.email "${{ vars.DEPLOY_AUTHOR_EMAIL || 'sophiahuh@gmail.com' }}"
          git checkout -B backend-implementation origin/backend-implementation
          git merge --no-ff -m "Deploy: main at $(git rev-parse --short origin/main)" origin/main
          git push origin backend-implementation
          echo "Pushed $(git rev-parse --short HEAD)."

      # Vercel builds what's uploaded, with the project's own Production environment variables.
      # A manual run with nothing new on main redeploys the branch as it is.
      - name: Deploy backend-implementation to Vercel (production)
        if: steps.diff.outputs.nothing != 'true' || github.event_name == 'workflow_dispatch'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ steps.diff.outputs.nothing }}" = "true" ]; then
            git checkout --detach origin/backend-implementation
          fi
          echo "Deploying $(git rev-parse --short HEAD) to production."
          npx --yes vercel@66.6.0 deploy --prod --yes --token "$VERCEL_TOKEN"
